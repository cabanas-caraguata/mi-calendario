<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabañas Caraguatá – Registro de Reservas</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap');
  :root { --fondo:#f5f0e8; --texto:#2a2218; --agua:#a8c5c0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',sans-serif; background:var(--fondo); color:var(--texto); min-height:100vh; padding-bottom:3rem; }
  header { background:var(--texto); color:#f0ece4; padding:1.8rem 1.5rem 1.3rem; text-align:center; }
  header h1 { font-family:'Playfair Display',serif; font-size:1.7rem; margin-bottom:0.3rem; }
  header p { font-size:0.8rem; color:var(--agua); letter-spacing:0.06em; text-transform:uppercase; }
  .contenedor { max-width:1000px; margin:0 auto; padding:1.2rem; }
  .barra-superior { display:flex; flex-wrap:wrap; gap:0.7rem; justify-content:space-between; align-items:center; margin-bottom:1.2rem; }
  .barra-superior a { color:var(--texto); font-size:0.85rem; text-decoration:underline; }
  .btn-excel { background:var(--texto); color:#f0ece4; border:none; padding:0.6rem 1.1rem; border-radius:8px; font-size:0.85rem; cursor:pointer; font-family:'Inter',sans-serif; }
  .resumen { background:#fff; border:1px solid #e0d8cc; border-radius:12px; padding:1rem 1.3rem; margin-bottom:1.2rem; display:flex; flex-wrap:wrap; gap:1.5rem; }
  .resumen div { font-size:0.8rem; color:#8a7f6e; }
  .resumen strong { display:block; font-family:'Playfair Display',serif; font-size:1.3rem; color:var(--texto); margin-top:0.1rem; }
  .aviso { background:#e03030; color:#fff; padding:0.7rem 1rem; border-radius:10px; font-size:0.85rem; font-weight:600; text-align:center; margin-bottom:1.2rem; }
  .separador { font-family:'Playfair Display',serif; font-size:1.1rem; color:#5a5044; margin:1.2rem 0 0.7rem; padding-bottom:0.3rem; border-bottom:2px solid #e0d8cc; }
  .separador-alerta { color:#b03a2e; border-bottom-color:#e5b3ac; }
  .tarjeta { background:#fff; border:1px solid #e0d8cc; border-radius:12px; padding:1rem 1.3rem; margin-bottom:0.9rem; }
  .tarjeta.falta { background:#fff4cc; border-color:#e8cf7a; }
  .tarjeta.choca { background:#fdeceb; border-color:#e5b3ac; }
  .pasadas .tarjeta { background:#e9e9e9; border-color:#cfcfcf; }
  .falta-txt { font-size:0.85rem; font-weight:600; color:#8a6a00; margin-bottom:0.6rem; }
  .tarjeta-top { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:0.5rem; margin-bottom:0.6rem; padding-bottom:0.6rem; border-bottom:1px solid #f0ece4; }
  .tarjeta-cabana { font-family:'Playfair Display',serif; font-size:1.25rem; }
  .tarjeta-fechas { font-size:0.95rem; color:#5a5044; }
  .tarjeta-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(110px,1fr)); gap:0.6rem 1rem; font-size:0.85rem; }
  .tarjeta-grid .etiqueta { color:#8a7f6e; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; }
  .tarjeta-grid .valor { font-weight:600; }
  .badge-ok { color:#2d7a3a; }
  .badge-pendiente { color:#b02a2a; }
  .pagos { margin-top:0.8rem; padding-top:0.7rem; border-top:1px dashed #e0d8cc; }
  .pagos-fila { display:flex; align-items:center; justify-content:space-between; gap:0.6rem; margin-bottom:0.5rem; font-size:0.9rem; }
  .pagos-fila label { color:#5a5044; }
  .pagos-fila input { width:130px; padding:0.45rem 0.5rem; border:1px solid #ccc; border-radius:8px; font-size:1rem; text-align:right; }
  .pagos-saldo { font-weight:700; }
  .pagos-botones { display:flex; gap:0.5rem; margin-top:0.6rem; flex-wrap:wrap; }
  .btn-pago { flex:1; border:none; padding:0.65rem 0.8rem; border-radius:8px; font-size:0.9rem; cursor:pointer; font-family:'Inter',sans-serif; }
  .btn-completo { background:#2d7a3a; color:#fff; }
  .btn-guardar { background:var(--texto); color:#f0ece4; }
  .btn-editar { background:#f0ece4; color:var(--texto); border:1px solid #e0d8cc; margin-top:0.8rem; width:100%; }
  .vacio { text-align:center; color:#aaa; padding:2rem; font-size:0.9rem; }
  #login { max-width:320px; margin:4rem auto; background:#fff; border:1px solid #e0d8cc; border-radius:12px; padding:1.5rem; text-align:center; }
  #login input { width:100%; padding:0.6rem; margin:0.8rem 0; border:1px solid #ccc; border-radius:8px; font-size:1rem; text-align:center; }
  #login button { background:var(--texto); color:#f0ece4; border:none; padding:0.6rem 1.2rem; border-radius:8px; cursor:pointer; font-size:0.9rem; }
  #contenido { display:none; }
</style>
</head>
<body>

<div id="login">
  <h2 style="font-family:'Playfair Display',serif;">Registro de Reservas</h2>
  <p style="font-size:0.8rem;color:#8a7f6e;margin-top:0.4rem;">Ingresá la contraseña de administrador</p>
  <input type="password" id="pass-input" placeholder="Contraseña">
  <button onclick="intentarLogin()">Entrar</button>
</div>

<div id="contenido">
  <header>
    <h1>Cabañas Caraguatá</h1>
    <p>Registro de reservas · v2</p>
  </header>
  <div class="contenedor">
    <div class="barra-superior">
      <a href="https://cabanas-caraguata.github.io/mi-calendario/?admin=1111">📅 Calendario (modo admin)</a>
      <button class="btn-excel" onclick="exportarExcel()">Exportar Excel</button>
    </div>
    <div class="resumen" id="resumen"></div>
    <div id="aviso-contenedor"></div>
    <div id="lista"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  const PASS = "1111";

  const firebaseConfig = {
    apiKey: "AIzaSyASHU5d-e2a1cKunNyY-ivNKHx3cFCwqCQ",
    authDomain: "cabanas-caraguata.firebaseapp.com",
    projectId: "cabanas-caraguata",
    storageBucket: "cabanas-caraguata.firebasestorage.app",
    messagingSenderId: "1063147857447",
    appId: "1:1063147857447:web:1275eb03c4360710271002"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const reservasRef = db.collection('calendario').doc('_reservas').collection('items');

  let reservas = [];

  // Comparte con el calendario el modo admin abierto 30 días (se renueva al entrar)
  const ADMIN_KEY = 'admin_hasta';
  const HORAS_ADMIN = 24 * 30; // 30 días
  function adminGuardado(){ try{ return Date.now() < Number(localStorage.getItem(ADMIN_KEY)||0); }catch(e){ return false; } }
  function recordarAdmin(){ try{ localStorage.setItem(ADMIN_KEY, String(Date.now()+HORAS_ADMIN*3600000)); }catch(e){} }

  function intentarLogin(){
    const p = document.getElementById('pass-input').value;
    if (p !== PASS) { alert('Contraseña incorrecta.'); return; }
    entrar();
  }
  function entrar(){
    recordarAdmin();
    document.getElementById('login').style.display = 'none';
    document.getElementById('contenido').style.display = 'block';
    escucharReservas();
  }
  document.getElementById('pass-input').addEventListener('keydown', e => { if (e.key === 'Enter') intentarLogin(); });
  if (adminGuardado()) entrar();

  // Mensaje para la casera: te llega a tu WhatsApp para reenviárselo a Yami
  function enviarACasera(id){
    const r = reservas.find(x=>x.id===id); if(!r) return;
    const f = (k)=>new Date(k+'T00:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'long'});
    let msg = `${(r.cabana||'').replace('Casa ','')} ${f(r.entrada)} al ${f(r.salida)}`;
    if(r.tel) msg += `\nTel: ${r.tel}`;
    const cliente = r.nombre || (((r.notas||'').match(/^Reserva online - (.*?) -/)||[])[1]) || '';
    const notasPropias = /^Reserva online/.test(r.notas||'') ? '' : (r.notas||'');
    if(cliente) msg += `\nCliente: ${cliente}`;
    msg += `\nNotas: ${notasPropias}`;
    msg += `\nSeña: ${formatPrecio(r.senia||0)}\nResto a pagar: ${formatPrecio(Math.max(0,saldoDe(r)))}`;
    window.open('https://api.whatsapp.com/send?phone=541158467707&text='+encodeURIComponent(msg),'_blank');
    reservasRef.doc(id).update({ yami_avisado:true }).catch(()=>{});
  }

  function fechaCorta(fechaStr){
    if(!fechaStr) return "-";
    const p = fechaStr.split("-");
    return p[2] + "-" + p[1];
  }

  function formatPrecio(n){
    return '$' + Math.round(n||0).toLocaleString('es-AR');
  }

  let abierta = null;

  function saldoDe(r){
    return (r.total||0) - (r.senia||0) - (r.pago_llegada||0);
  }

  function editorPagos(r){
    return `
      <div class="pagos">
        <div class="pagos-fila"><label>Seña</label><input id="p-senia-${r.id}" type="number" inputmode="numeric" value="${r.senia||0}" oninput="actualizarSaldo('${r.id}')"></div>
        <div class="pagos-fila"><label>Pago al llegar</label><input id="p-llegada-${r.id}" type="number" inputmode="numeric" value="${r.pago_llegada||0}" oninput="actualizarSaldo('${r.id}')"></div>
        <div class="pagos-fila"><span>Saldo</span><span class="pagos-saldo" id="p-saldo-${r.id}">${formatPrecio(saldoDe(r))}</span></div>
        <div class="pagos-botones">
          <button class="btn-pago btn-completo" onclick="pagoCompleto('${r.id}')">✓ Pagó todo</button>
          <button class="btn-pago btn-guardar" onclick="guardarPagos('${r.id}')">Guardar</button>
        </div>
        <div class="pagos-botones"><button class="btn-pago btn-editar" style="margin-top:0" onclick="abierta=null;render()">Cancelar</button></div>
      </div>`;
  }

  function abrirPagos(id){ abierta = id; render(); }

  function leerPagos(id){
    return {
      senia: parseFloat(document.getElementById('p-senia-'+id).value)||0,
      pago_llegada: parseFloat(document.getElementById('p-llegada-'+id).value)||0
    };
  }

  function actualizarSaldo(id){
    const r = reservas.find(x=>x.id===id); if(!r) return;
    const p = leerPagos(id);
    document.getElementById('p-saldo-'+id).textContent = formatPrecio(r.total - p.senia - p.pago_llegada);
  }

  function pagoCompleto(id){
    const r = reservas.find(x=>x.id===id); if(!r) return;
    const senia = parseFloat(document.getElementById('p-senia-'+id).value)||0;
    document.getElementById('p-llegada-'+id).value = Math.max(0, r.total - senia);
    actualizarSaldo(id);
    guardarPagos(id);
    try { avisarPagoTotal(r); } catch(e) {}
  }

  function telWhatsApp(tel){
    let n = String(tel||'').replace(/\D/g,'').replace(/^54/,'').replace(/^0/,'');
    if(n.length===11 && n[0]==='9') n = n.slice(1);
    if(n.length===10 && n.startsWith('15')) n = '11' + n.slice(2);
    if(n.length===12 && n.startsWith('1115')) n = '11' + n.slice(4);
    return '549' + n;
  }

  // Mensaje de confirmación para el cliente (mismo texto que en el calendario)
  const CAL_URL = "https://cabanas-caraguata.github.io/mi-calendario/";
  const INFO_URL = "https://cabanas-caraguata.github.io/mi-calendario/bienvenida.html";
  const HORA_ENTRADA = "8:00 hs";
  const HORA_SALIDA = "18:30 hs";
  function mensajeConfirmacion(r, senia){
    const f=(k)=>new Date(k+'T00:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
    const nombre=(r.nombre||'').split(' ')[0];
    const saldo=Math.max(0,(r.total||0)-senia);
    return `¡Hola${nombre?' '+nombre:''}! Recibimos tu seña y tu reserva quedó *CONFIRMADA*.\n\n`+
      `*${r.cabana}*\n`+
      `Entrada: ${f(r.entrada)}, desde las ${HORA_ENTRADA}\n`+
      `Salida: ${f(r.salida)}, hasta las ${HORA_SALIDA}\n`+
      `Total: ${formatPrecio(r.total)}\n`+
      `Seña recibida: ${formatPrecio(senia)}\n`+
      `*Saldo a abonar al llegar: ${formatPrecio(saldo)}*\n\n`+
      `Es muy importante que leas con atención toda la información de tu estadía (horarios, cómo llegar, wifi, normas y emergencias):\n${INFO_URL}\n\n`+
      `El saldo lo podés pagar en efectivo a Yami cuando llegues, o por transferencia. Para transferir, entrá a este link y seguí los pasos:\n${CAL_URL}?pagar=${r.id}\n\n`+
      `Gracias y disfrutá la estadía.`;
  }
  function pagoOk(id){
    reservasRef.doc(id).update({ pago_verificado:true })
      .catch(()=> alert('No se pudo guardar. Revisá la conexión.'));
  }
  function avisarCliente(id){
    const r = reservas.find(x=>x.id===id); if(!r || !r.tel) return;
    window.open('https://api.whatsapp.com/send?phone=' + telWhatsApp(r.tel) + '&text=' + encodeURIComponent(mensajeConfirmacion(r, r.senia||0)), '_blank');
    reservasRef.doc(id).update({ cliente_avisado:true }).catch(()=>{});
  }
  // Marca la reserva como avisada (cliente y Yami) sin abrir WhatsApp
  function yaAvisado(id){
    reservasRef.doc(id).update({ cliente_avisado:true, yami_avisado:true })
      .catch(()=> alert('No se pudo guardar. Revisá la conexión.'));
  }

  function avisarPagoTotal(r){
    if(!r.tel) return;
    const _h = new Date();
    const hoy = _h.getFullYear()+'-'+String(_h.getMonth()+1).padStart(2,'0')+'-'+String(_h.getDate()).padStart(2,'0');
    const resena = 'https://g.page/r/CdzvbHsO9WpWEBE/review';
    const msg = (r.salida||'') <= hoy
      ? '¡Hola! Recibimos el pago total, muchas gracias por elegirnos 😊\nSi la pasaron lindo, nos ayuda mucho una reseña en Google:\n' + resena
      : '¡Hola! Recibimos el pago total, muchas gracias 😊 ¡Que disfruten la estadía!\nSi la pasan lindo, nos ayuda mucho una reseña en Google:\n' + resena;
    window.open('https://wa.me/' + telWhatsApp(r.tel) + '?text=' + encodeURIComponent(msg), '_blank');
  }

  function guardarPagos(id){
    const r = reservas.find(x=>x.id===id); if(!r) return;
    const p = leerPagos(id);
    const saldo = r.total - p.senia - p.pago_llegada;
    reservasRef.doc(id).update({ senia: p.senia, pago_llegada: p.pago_llegada, saldo })
      .then(()=>{ abierta = null; render(); })
      .catch(()=> alert('No se pudo guardar. Revisá la conexión.'));
  }

  function detectarSuperposiciones(lista){
    const superpuestos = new Set();
    for(let i=0;i<lista.length;i++){
      for(let j=i+1;j<lista.length;j++){
        if(lista[i].cabana!==lista[j].cabana) continue;
        if(lista[i].entrada<=lista[j].salida && lista[j].entrada<=lista[i].salida){
          superpuestos.add(lista[i].id);
          superpuestos.add(lista[j].id);
        }
      }
    }
    return superpuestos;
  }

  function render(){
    const lista = document.getElementById('lista');
    const resumen = document.getElementById('resumen');
    const avisoCont = document.getElementById('aviso-contenedor');

    if(!reservas.length){
      lista.innerHTML = '<div class="vacio">No hay reservas registradas todavía</div>';
      resumen.innerHTML = '';
      avisoCont.innerHTML = '';
      return;
    }

    const ordenadas = [...reservas].sort((a,b)=> (a.entrada||'').localeCompare(b.entrada||''));
    const superpuestos = detectarSuperposiciones(ordenadas);

    const totalG = reservas.reduce((s,r)=>s+r.total,0);
    const seniaG = reservas.reduce((s,r)=>s+(r.senia||0),0);
    const llegadaG = reservas.reduce((s,r)=>s+(r.pago_llegada||0),0);
    const saldoG = reservas.reduce((s,r)=>s+saldoDe(r),0);
    resumen.innerHTML = `
      <div>Reservas<strong>${reservas.length}</strong></div>
      <div>Total<strong>${formatPrecio(totalG)}</strong></div>
      <div>Señas cobradas<strong>${formatPrecio(seniaG)}</strong></div>
      <div>Cobrado al llegar<strong>${formatPrecio(llegadaG)}</strong></div>
      <div>Saldo pendiente<strong>${formatPrecio(saldoG)}</strong></div>
    `;

    avisoCont.innerHTML = superpuestos.size
      ? '<div class="aviso">⚠️ Hay reservas de una misma cabaña con fechas que se pisan. Revisá las tarjetas marcadas.</div>'
      : '';

    const _h = new Date();
    const hoy = _h.getFullYear()+'-'+String(_h.getMonth()+1).padStart(2,'0')+'-'+String(_h.getDate()).padStart(2,'0');
    // Las que esperan el okay de Rubén (sin comprobante o con pago sin revisar) van fijas arriba de todo
    const aRevisar = r => r.estado==='pendiente' || r.pago_verificado===false;
    const paraRevisar = ordenadas.filter(aRevisar);
    const resto = ordenadas.filter(r => !aRevisar(r));
    // Reservas online ya confirmadas a las que todavía no les mandaste el mensaje a Yami: van arriba hasta que toques "Mensaje para Yami"
    const esOnline = r => !!r.nombre || /^Reserva online/.test(r.notas||'');
    const faltaYami = resto.filter(r => esOnline(r) && !r.yami_avisado && (r.salida||'') >= hoy);
    const proximas = resto.filter(r => (r.salida||'') >= hoy && !faltaYami.includes(r));
    const pasadasTodas = resto.filter(r => (r.salida||'') < hoy).reverse();
    const faltaCobrar = pasadasTodas.filter(r => saldoDe(r) > 0);
    const pasadas = pasadasTodas.filter(r => saldoDe(r) <= 0);
    const tarjeta = r => {
      const saldo = saldoDe(r);
      const saldoOk = saldo <= 0;
      const choca = superpuestos.has(r.id);
      // Lo que falta hacer (solo reservas de hoy en adelante): la tarjeta se pinta de amarillo
      const faltas = [];
      if((r.salida||'') >= hoy){
        if(r.estado==='pendiente') faltas.push('⏳ confirmar');
        else if(r.pago_verificado===false) faltas.push('🔎 ver que entró la plata');
        // Si subió el comprobante, el aviso de confirmación le llegó solo (AutoResponder)
        if(r.estado!=='pendiente' && r.tel && !r.cliente_avisado && !r.comprobante_subido) faltas.push('💬 avisar al cliente');
        if(r.estado!=='pendiente' && !r.yami_avisado) faltas.push('🏠 mensaje a Yami');
      }
      const falta = faltas.length > 0;
      return `
        <div class="tarjeta${choca?' choca':(falta?' falta':'')}">
          <div class="tarjeta-top">
            <div class="tarjeta-cabana">${choca?'⚠️ ':''}${r.estado==='pendiente'?'⏳ ':(r.pago_verificado===false?'🔎 ':'')}${r.cabana}</div>
            <div class="tarjeta-fechas">${fechaCorta(r.entrada)} → ${fechaCorta(r.salida)} · ${r.dias} día${r.dias>1?'s':''}</div>
          </div>
          ${falta ? `<div class="falta-txt">Falta: ${faltas.join(' · ')}</div>` : ''}
          <div class="tarjeta-grid">
            <div><div class="etiqueta">Cargada</div><div class="valor">${r.fecha_registro?fechaCorta(r.fecha_registro):'-'}</div></div>
            <div><div class="etiqueta">Total</div><div class="valor">${formatPrecio(r.total)}</div></div>
            <div><div class="etiqueta">Seña</div><div class="valor">${formatPrecio(r.senia||0)}</div></div>
            <div><div class="etiqueta">Al llegar</div><div class="valor">${formatPrecio(r.pago_llegada||0)}</div></div>
            <div><div class="etiqueta">Saldo</div><div class="valor ${saldoOk?'badge-ok':'badge-pendiente'}">${saldoOk?'✅ $0':formatPrecio(saldo)}</div></div>
            <div><div class="etiqueta">Tel</div><div class="valor">${r.tel?`<a href="https://wa.me/54${r.tel.replace(/\D/g,'')}" target="_blank">${r.tel}</a>`:'-'}</div></div>
            <div><div class="etiqueta">Notas</div><div class="valor">${r.notas||'-'}</div></div>
          </div>
          ${(r.estado!=='pendiente' && r.pago_verificado===false) ? `<button class="btn-pago btn-editar" style="margin-bottom:0.5rem" onclick="pagoOk('${r.id}')">✔ La plata entró</button>` : ''}
          ${abierta===r.id ? editorPagos(r) : `<button class="btn-pago btn-editar" onclick="abrirPagos('${r.id}')">💵 Cargar pagos</button>`}
          ${(r.estado==='pendiente' || !r.tel) ? '' : `<button class="btn-pago btn-editar" style="margin-top:0.5rem" onclick="avisarCliente('${r.id}')">💬 Avisar al cliente</button>`}
          ${r.estado==='pendiente' ? '' : `<button class="btn-pago btn-editar" style="margin-top:0.5rem" onclick="enviarACasera('${r.id}')">🏠 Mensaje para Yami</button>`}
          ${(falta && r.estado!=='pendiente' && r.pago_verificado!==false && (!r.yami_avisado || (r.tel && !r.cliente_avisado && !r.comprobante_subido))) ? `<button class="btn-pago btn-editar" style="margin-top:0.5rem" onclick="yaAvisado('${r.id}')">✔ Ya avisé a los dos</button>` : ''}
        </div>`;
    };
    lista.innerHTML =
      (paraRevisar.length ? '<div class="separador separador-alerta">⏳ Para revisar</div>' + paraRevisar.map(tarjeta).join('') : '') +
      (faltaYami.length ? '<div class="separador separador-alerta">🏠 Falta avisar a Yami</div>' + faltaYami.map(tarjeta).join('') : '') +
      (faltaCobrar.length ? '<div class="separador separador-alerta">⚠️ Falta cobrar</div>' + faltaCobrar.map(tarjeta).join('') : '') +
      '<div class="separador">Hoy y próximas</div>' +
      (proximas.length ? proximas.map(tarjeta).join('') : '<div class="vacio">No hay reservas para hoy ni próximas</div>') +
      (pasadas.length ? '<div class="separador">Ya pasaron</div><div class="pasadas">' + pasadas.map(tarjeta).join('') + '</div>' : '');
  }

  function escucharReservas(){
    reservasRef.onSnapshot((snap) => {
      reservas = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      if(!abierta) render();
    }, (err) => {
      document.getElementById('lista').innerHTML = '<div class="vacio">Sin conexión al registro de reservas</div>';
    });
  }

  function exportarExcel(){
    if(!reservas.length){ alert("No hay reservas para exportar."); return; }
    let csv="Cabana,F.Reserva,Entrada,Salida,Dias,Total,Senia,Pago llegada,Saldo,Telefono,Notas\n";
    reservas.forEach(r=>{ csv+=`${r.cabana},${r.fecha_registro||""},${r.entrada.split("-").reverse().join("-")},${r.salida.split("-").reverse().join("-")},${r.dias},${r.total},${r.senia||0},${r.pago_llegada||0},${saldoDe(r)},${r.tel||''},${(r.notas||'').replace(/,/g,' ')}\n`; });
    const totalG=reservas.reduce((s,r)=>s+r.total,0);
    csv+=`\nTOTAL,,,, ${totalG}\n`;
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='reservas-caraguata.csv'; a.click(); URL.revokeObjectURL(url);
  }
</script>
</body>
