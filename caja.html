<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Caja de Yami</title>
<link rel="icon" href="favicon.png">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2421;--mut:#6d726e;--in:#1f8a4c;--out:#c0392b;--gas:#c77a12;--line:#e7e3da}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:20px;margin:4px 0 14px;font-weight:700}
.saldo{background:#24382c;color:#fff;border-radius:18px;padding:20px 18px}
.saldo small{opacity:.75;font-size:14px}.saldo .n{font-size:40px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.saldo .u{font-size:13px;opacity:.7;margin-top:6px}
h2{font-size:15px;color:var(--mut);font-weight:600;margin:22px 4px 8px;text-transform:uppercase;letter-spacing:.4px}
.card{background:var(--card);border-radius:14px;border:1px solid var(--line)}
.casas{padding:4px 14px}.casa{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.casa:last-child{border:0}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:10px;vertical-align:-1px}
.mov{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.mov:last-child{border:0}.mov .f{font-size:13px;color:var(--mut)}.mov .t{font-size:16px;text-transform:capitalize}
.mov .m{font-weight:700;font-size:17px;white-space:nowrap;margin-left:10px}
.pos{color:var(--in)}.neg{color:var(--out)}.gas{color:var(--gas)}
.mesh{padding:8px 14px;background:#efece4;font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase}
button{display:block;width:100%;margin-top:10px;padding:13px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:600;color:var(--ink)}
.nota{font-size:13px;color:var(--mut);margin:16px 4px 0}
#login{max-width:360px;margin:18vh auto 0;padding:0 18px;text-align:center}
#login input{width:100%;padding:14px;font-size:19px;border:1px solid var(--line);border-radius:12px;text-align:center;margin-top:14px}
#login .ok{background:#24382c;color:#fff;border:0}
#lerr{color:var(--out);min-height:20px;margin-top:8px}
#app{display:none}

.fab{position:fixed;right:16px;bottom:18px;width:auto;margin:0;padding:15px 22px;border-radius:30px;background:#24382c;color:#fff;border:0;font-size:17px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:9}
.panel{max-height:92vh;overflow:auto;background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px 22px}
.panel h3{margin:0 0 12px;font-size:19px}.lab{font-size:14px;color:var(--mut);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{width:auto;margin:0;padding:10px 14px;border-radius:22px;font-size:15px}
.chip.on{background:#24382c;color:#fff;border-color:#24382c}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tile{margin:0;padding:14px 4px;border:2px solid var(--line);border-radius:14px;font-size:16px}.tile span{display:block;font-size:26px;margin-bottom:4px}.tile.on{border-color:#24382c;background:#e8efe9}.tiles.alerta .tile{border-color:var(--out)}
.panel input{width:100%;padding:12px;font-size:18px;border:1px solid var(--line);border-radius:10px}
.acc{display:flex;gap:10px;margin-top:16px}.acc button{margin:0}.okv{background:#1f8a4c;color:#fff;border:0}
.err{color:var(--out);font-size:14px;margin-top:8px;min-height:18px}
.del{font-size:12px;color:var(--out);margin-left:6px;text-decoration:underline;cursor:pointer}
.aviso{font-size:13px;color:var(--mut);margin:8px 4px 0;min-height:16px}
.adm{display:inline-block;font-size:12px;background:#e8efe9;color:#24382c;border-radius:10px;padding:2px 8px;margin-left:6px;vertical-align:3px}
.salir{background:none;border:0;color:var(--mut);font-size:13px;text-decoration:underline;width:auto;margin:14px auto 0;padding:4px}
</style></head><body>
<form id="login" autocomplete="off">
<div style="font-size:44px">🏡</div>
<h1>Caja de Yami</h1>
<div style="color:var(--mut)">Escribí la contraseña</div>
<input id="pw" type="password" autocapitalize="none">
<div id="lerr"></div>
<button class="ok" type="submit">Entrar</button>
</form>
<div class="wrap" id="app">
<h1>🏡 Caja de Yami · Cabañas Caraguatá<span class="adm" id="admTag" style="display:none">admin</span></h1>
<div class="saldo"><small>Saldo actual</small><div class="n" id="saldo"></div><div class="u" id="ult"></div></div>
<h2 id="mesTit"></h2>
<div class="card casas"><div class="casa"><span>🟢 Entró</span><b class="pos" id="mIn"></b></div><div class="casa"><span>🔴 Sueldo</span><b class="neg" id="mOut"></b></div><div class="casa"><span>🟠 Gastos</span><b class="gas" id="mGas"></b></div></div>
<h2>Por casa y kayak este mes</h2><div class="card casas" id="casas"></div>
<h2>Movimientos</h2><div class="card" id="lista"></div>
<button id="mas">Ver más movimientos</button>
<p class="aviso" id="aviso"></p><p class="nota">Verde: cobros de las casas y kayak · Rojo: sueldo · Naranja: gastos.</p>
<button class="salir" id="salir">Salir</button>
</div>
<button class="fab" id="fab">+ Agregar</button>
<div class="bg" id="bg"><div class="panel">
<h3>Agregar movimiento</h3>
<div class="tiles" id="tipos"><button class="tile" data-t="entrada"><span>🟢</span>Cobro</button><button class="tile" data-t="sueldo"><span>🔴</span>Sueldo</button><button class="tile" data-t="gasto"><span>🟠</span>Gasto</button></div>
<div id="casaBox"><div class="lab">¿De dónde?</div>
<div class="chips" id="casasSel"><button class="chip" data-c="roja">Roja</button><button class="chip" data-c="verde">Verde</button><button class="chip" data-c="marrón">Marrón</button><button class="chip" data-c="blanca">Blanca</button><button class="chip" data-c="kayak">🛶 Kayak</button></div></div>
<div class="lab">Monto ($)</div><input id="monto" inputmode="numeric" placeholder="ej. 70000">
<div class="lab">Detalle (opcional)</div><input id="det" placeholder="ej. combustible">
<div class="lab">Fecha</div><input id="fecha" type="date">
<div class="err" id="err"></div>
<div class="acc"><button id="cancel">Cancelar</button><button class="okv" id="guardar">Guardar</button></div>
</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const $=id=>document.getElementById(id);
const fmt=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es-AR');
const fd=d=>{if(!d)return 'sin fecha';const[a,m,dd]=d.split('-');return +dd+' '+MESES[m-1].slice(0,3)+' '+a.slice(2)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CASAS=[['roja','#c0392b','Casa roja'],['verde','#2e8b57','Casa verde'],['marr','#8b5a2b','Casa marrón'],['blanca','#b9b4a8','Casa blanca'],['kayak','#2f7fb8','Kayak']];
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function derivar(pw,salt){
 const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.trim().toLowerCase()),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(salt),iterations:P.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const des=async(k,iv,c)=>new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(iv)},k,u8(c)));
let CLAVE=null,ADMIN=false,BASE=[],nuevos=[],db=null,movs=[],visibles=40;
async function entrar(pw){
 try{const k=await derivar(pw,P.s);BASE=JSON.parse(await des(k,P.i,P.c));CLAVE=k;ADMIN=false;return 'ver'}catch(_){}
 const ka=await derivar(pw,P.ws);const ver=await des(ka,P.wi,P.wc);
 const k=await derivar(ver,P.s);BASE=JSON.parse(await des(k,P.i,P.c));CLAVE=k;ADMIN=true;return 'admin';
}
function render(){
 const extra=[...nuevos].sort((a,b)=>(a.creado||0)-(b.creado||0));
 let saldo=0;movs=BASE.map(([d,e,s,n])=>({d,e,s,n})).concat(extra).map(x=>{const m=(+x.e||0)-(+x.s||0);saldo+=m;return{...x,n:x.n||'',m,tipo:x.s>0?'sueldo':(x.e<0?'gasto':'entrada')}});
 $('saldo').textContent=fmt(saldo);
 const ultimo=[...movs].reverse().find(x=>x.d);
 $('ult').textContent='Último movimiento: '+fd(ultimo.d);
 const mk=ultimo.d.slice(0,7);
 $('mesTit').textContent=MESES[+mk.slice(5)-1]+' '+mk.slice(0,4);
 let mi=0,mo=0,mg=0;const pc={};
 movs.filter(x=>x.d&&x.d.startsWith(mk)).forEach(x=>{if(x.tipo==='entrada')mi+=x.m;else if(x.tipo==='sueldo')mo-=x.m;else mg-=x.m;
  if(x.tipo==='entrada'){const c=CASAS.find(c=>x.n.toLowerCase().includes(c[0]));if(c)pc[c[0]]=(pc[c[0]]||0)+x.m}});
 $('mIn').textContent=fmt(mi);$('mOut').textContent=fmt(mo);$('mGas').textContent=fmt(mg);
 $('casas').innerHTML=CASAS.map(c=>'<div class="casa"><span><span class="dot" style="background:'+c[1]+'"></span>'+c[2]+'</span><b>'+fmt(pc[c[0]]||0)+'</b></div>').join('');
 lista();
}
function lista(){
 const rev=[...movs].reverse();let mesAnt=null,h='';
 rev.slice(0,visibles).forEach(x=>{const k=x.d?x.d.slice(0,7):mesAnt;
  if(k&&k!==mesAnt){h+='<div class="mesh">'+MESES[+k.slice(5)-1]+' '+k.slice(0,4)+'</div>';mesAnt=k}
  const borrar=(x.id&&ADMIN)?'<span class="del" data-id="'+esc(x.id)+'">borrar</span>':'';
  h+='<div class="mov"><div><div class="t">'+(esc(x.n)||(x.tipo==='sueldo'?'Sueldo':'Entrada'))+'</div><div class="f">'+fd(x.d)+' · '+x.tipo+borrar+'</div></div><div class="m '+(x.tipo==='entrada'?'pos':x.tipo==='sueldo'?'neg':'gas')+'">'+(x.m>0?'+':'')+fmt(x.m)+'</div></div>'});
 $('lista').innerHTML=h;$('mas').style.display=visibles>=rev.length?'none':'block';
}
$('mas').onclick=()=>{visibles+=40;lista()};
function conectar(){
 try{firebase.initializeApp({apiKey:"AIzaSyASHU5d-e2a1cKunNyY-ivNKHx3cFCwqCQ",authDomain:"cabanas-caraguata.firebaseapp.com",projectId:"cabanas-caraguata",storageBucket:"cabanas-caraguata.firebasestorage.app",messagingSenderId:"1063147857447",appId:"1:1063147857447:web:1275eb03c4360710271002"});
  db=firebase.firestore().collection('calendario').doc('_caja').collection('items');}catch(e){$('aviso').textContent='No se pudieron cargar los movimientos nuevos.';return}
 const t=setTimeout(()=>{$('aviso').textContent='Cargando movimientos nuevos…'},8000);
 db.onSnapshot(async snap=>{clearTimeout(t);$('aviso').textContent='';
  const out=[];for(const d of snap.docs){try{const x=JSON.parse(await des(CLAVE,d.data().i,d.data().c));x.id=d.id;out.push(x)}catch(_){}}
  nuevos=out;render()},()=>{clearTimeout(t);$('aviso').textContent='No se pudieron cargar los movimientos nuevos.'});
}
function arrancar(modo){
 $('login').style.display='none';$('app').style.display='block';
 if(ADMIN){$('fab').style.display='block';$('admTag').style.display='inline-block'}
 render();conectar();
}
$('login').onsubmit=async e=>{e.preventDefault();$('lerr').textContent='Abriendo…';
 try{const m=await entrar($('pw').value);try{localStorage.setItem('cajaYami',$('pw').value)}catch(_){}arrancar(m)}
 catch(_){$('lerr').textContent='Contraseña incorrecta'}};
$('salir').onclick=()=>{try{localStorage.removeItem('cajaYami')}catch(_){}location.reload()};
(async()=>{let g=null;try{g=localStorage.getItem('cajaYami')}catch(_){}
 const h=decodeURIComponent(location.hash.slice(1));
 if(h){try{arrancar(await entrar(h));return}catch(_){}}
 if(g){try{arrancar(await entrar(g))}catch(_){}}})();
// borrar
$('lista').addEventListener('click',async ev=>{const el=ev.target.closest('.del');if(!el||!ADMIN)return;
 if(el.dataset.ok!=='1'){el.dataset.ok='1';el.textContent='¿seguro? tocá de nuevo';return}
 try{await db.doc(el.dataset.id).delete()}catch(e){el.textContent='no se pudo borrar'}});
// formulario
let tipo=null,casa=null;
function hoy(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function marcar(){document.querySelectorAll('#tipos .tile').forEach(b=>b.classList.toggle('on',b.dataset.t===tipo));
 document.querySelectorAll('#casasSel .chip').forEach(b=>b.classList.toggle('on',b.dataset.c===casa));
 $('casaBox').style.display=tipo==='entrada'||tipo===null?'block':'none'}
$('fab').onclick=()=>{tipo=null;casa=null;$('monto').value='';$('det').value='';$('fecha').value=hoy();$('err').textContent='';$('tipos').classList.remove('alerta');marcar();$('bg').style.display='flex'};
$('tipos').onclick=e=>{const b=e.target.closest('.tile');if(b){tipo=b.dataset.t;$('tipos').classList.remove('alerta');$('err').textContent='';marcar()}};
$('casasSel').onclick=e=>{const b=e.target.closest('.chip');if(b){casa=b.dataset.c;tipo='entrada';$('tipos').classList.remove('alerta');$('err').textContent='';marcar()}};
$('cancel').onclick=()=>{$('bg').style.display='none'};
$('guardar').onclick=async()=>{
 const monto=Math.round(Number(String($('monto').value).replace(/[.\s$]/g,'').replace(',','.')));
 if(!tipo){$('err').textContent='Tocá arriba: Cobro, Sueldo o Gasto';$('tipos').classList.add('alerta');$('tipos').scrollIntoView({block:'center'});return}
 if(!monto||monto<=0){$('err').textContent='Poné el monto';return}
 if(tipo==='entrada'&&!casa&&!$('det').value.trim()){$('err').textContent='Elegí la casa o kayak';return}
 const det=$('det').value.trim();
 const nota=tipo==='entrada'?[casa,det].filter(Boolean).join(' '):(det||(tipo==='sueldo'?'sueldo':'gasto'));
 const x={d:$('fecha').value||hoy(),e:tipo==='entrada'?monto:(tipo==='gasto'?-monto:0),s:tipo==='sueldo'?monto:0,n:nota,creado:Date.now()};
 $('guardar').disabled=true;$('err').textContent='Guardando…';
 try{const iv=crypto.getRandomValues(new Uint8Array(12));
  const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},CLAVE,new TextEncoder().encode(JSON.stringify(x)));
  await db.add({i:b64(iv),c:b64(c),t:Date.now()});$('bg').style.display='none'}
 catch(e){$('err').textContent='No se pudo guardar, probá de nuevo'}
 $('guardar').disabled=false};
</script></body></html>
